AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  BPP Campus Store - network, security group and a single EC2 instance that
  runs the application straight from the GitHub repository. Deliberately
  contains no IAM resources so it can run in a restricted Skillable CloudSlice sandbox.

Parameters:
  EnvironmentName:
    Type: String
    Default: campus-store
    AllowedPattern: "^[a-z][a-z0-9-]{1,30}$"
    Description: Prefix used for resource names and tags.
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t3.small, t3.medium]
  AllowedCidr:
    Type: String
    Default: 0.0.0.0/0
    AllowedPattern: "^([0-9]{1,3}\\.){3}[0-9]{1,3}/[0-9]{1,2}$"
    Description: CIDR range allowed to reach the web server on port 80.
  GitRepoUrl:
    Type: String
    AllowedPattern: "^https://github\\.com/[A-Za-z0-9._-]+/[A-Za-z0-9._-]+(\\.git)?$"
    Description: HTTPS URL of the GitHub repository to deploy (supplied by the pipeline).
  GitSha:
    Type: String
    AllowedPattern: "^[a-f0-9]{7,40}$"
    Description: Commit SHA to deploy (supplied by the pipeline).
  GitHubToken:
    Type: String
    NoEcho: true
    Default: ""
    Description: Short-lived, read-only token used to clone a private repository. Leave empty for public repositories.
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - { Key: Name, Value: !Sub "${EnvironmentName}-vpc" }

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - { Key: Name, Value: !Sub "${EnvironmentName}-igw" }

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - { Key: Name, Value: !Sub "${EnvironmentName}-public" }

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub "${EnvironmentName}-public-rt" }

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP to the campus store
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: !Ref AllowedCidr, Description: HTTP }
      Tags:
        - { Key: Name, Value: !Sub "${EnvironmentName}-web-sg" }

  WebServer:
    Type: AWS::EC2::Instance
    DependsOn: PublicRoute
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds: [!Ref WebSecurityGroup]
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
      Tags:
        - { Key: Name, Value: !Sub "${EnvironmentName}-web" }
        - { Key: DeployedSha, Value: !Ref GitSha }
      # Changing UserData (a new commit SHA) makes CloudFormation restart the
      # instance. On every boot, campus-store-sync re-reads the user data from
      # the metadata service and checks out the requested commit.
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          # STORE_REPO_URL=${GitRepoUrl}
          # STORE_GIT_SHA=${GitSha}
          # STORE_GIT_TOKEN=${GitHubToken}
          set -euxo pipefail

          dnf install -y nodejs20 git
          ln -sf /usr/bin/node-20 /usr/local/bin/node

          cat > /usr/local/bin/campus-store-sync <<'SYNC'
          #!/bin/bash
          set -euo pipefail
          IMDS=http://169.254.169.254/latest
          TOKEN_HDR=$(curl -sS -X PUT "$IMDS/api/token" -H 'X-aws-ec2-metadata-token-ttl-seconds: 60')
          USER_DATA=$(curl -sS -H "X-aws-ec2-metadata-token: $TOKEN_HDR" "$IMDS/user-data")
          setting() { echo "$USER_DATA" | sed -n "s/^# $1=//p" | head -n 1; }
          REPO_URL=$(setting STORE_REPO_URL)
          GIT_SHA=$(setting STORE_GIT_SHA)
          GIT_TOKEN=$(setting STORE_GIT_TOKEN)

          AUTH_URL="$REPO_URL"
          if [ -n "$GIT_TOKEN" ]; then
            AUTH_URL=$(echo "$REPO_URL" | sed "s#^https://#https://x-access-token:$GIT_TOKEN@#")
          fi

          mkdir -p /opt/campus-store
          cd /opt/campus-store
          [ -d .git ] || git init -q
          git remote remove origin 2>/dev/null || true
          git remote add origin "$AUTH_URL"
          if git fetch --depth 1 origin "$GIT_SHA"; then
            git checkout -q -f FETCH_HEAD
          else
            echo "Could not fetch $GIT_SHA; keeping the version already on disk" >&2
          fi
          git remote set-url origin "$REPO_URL"

          printf 'PORT=80\nGIT_SHA=%s\n' "$GIT_SHA" > /etc/campus-store.env
          systemctl daemon-reload
          systemctl restart campus-store
          SYNC
          chmod +x /usr/local/bin/campus-store-sync

          cat > /etc/systemd/system/campus-store.service <<'UNIT'
          [Unit]
          Description=BPP Campus Store
          After=network.target

          [Service]
          EnvironmentFile=/etc/campus-store.env
          WorkingDirectory=/opt/campus-store/app
          ExecStart=/usr/local/bin/node src/server.js
          User=nobody
          AmbientCapabilities=CAP_NET_BIND_SERVICE
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
          UNIT

          cat > /etc/systemd/system/campus-store-sync.service <<'UNIT'
          [Unit]
          Description=Sync BPP Campus Store to the requested commit
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/campus-store-sync

          [Install]
          WantedBy=multi-user.target
          UNIT

          systemctl daemon-reload
          systemctl enable campus-store campus-store-sync
          /usr/local/bin/campus-store-sync

  ElasticIp:
    Type: AWS::EC2::EIP
    DependsOn: GatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - { Key: Name, Value: !Sub "${EnvironmentName}-eip" }

  ElasticIpAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt ElasticIp.AllocationId
      InstanceId: !Ref WebServer

Outputs:
  PublicUrl:
    Description: URL of the deployed store
    Value: !Sub "http://${ElasticIp}"
  InstanceId:
    Description: EC2 instance running the store
    Value: !Ref WebServer
  DeployedSha:
    Description: Commit SHA this stack was deployed from
    Value: !Ref GitSha
